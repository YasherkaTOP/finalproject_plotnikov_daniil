[project]
name = "finalproject-plotnikov-daniil"
version = "0.1.0"
description = "ValutaTrade Hub — консольное приложение для симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.32.0",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# Настройки приложения (читает SettingsLoader)
[tool.valutatrade]
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
history_file = "data/exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_level = "INFO"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_max_bytes = 1000000
log_backup_count = 3
